<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Game Tool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden}
#app{width:100%;height:100%;display:flex;flex-direction:column;padding:16px}
.h{display:flex;justify-content:space-between;align-items:center;padding:8px 0 16px}
.back{background:none;border:none;color:#fff;font-size:24px;padding:4px;cursor:pointer}
.logo{font-size:28px;font-weight:900;letter-spacing:2px;color:#fff}
.card{background:#0a0a0a;border-radius:16px;border:2px solid #4a90e2;padding:20px 16px;margin-bottom:12px;flex:1;display:flex;flex-direction:column;overflow:hidden}
.tit{font-size:20px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.btn{width:100%;padding:16px;border-radius:14px;border:none;background:#4a90e2;color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:12px}
.btn-outline{padding:12px 20px;border-radius:10px;border:2px solid #4a90e2;background:transparent;color:#4a90e2;font-size:13px;font-weight:600;cursor:pointer}
.btn2{width:100%;padding:14px;border-radius:12px;border:none;background:#1a1a1a;color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:8px;display:flex;align-items:center;gap:12px;text-align:left}
.btn2:hover{background:#222}
.list{flex:1;overflow-y:auto}
.game-item{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;background:#111;margin-bottom:8px}
.game-icon{font-size:24px}
.game-info{flex:1}
.game-name{font-size:15px;font-weight:600}
.game-ver{font-size:12px;color:#888}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;z-index:999}
.empty{color:#888;text-align:center;padding:40px 20px}
</style></head>
<body>
<div id="app">
<div class="h"><button class="back" onclick="history.back()">&#8592;</button><span class="logo">PS5</span><button class="back" onclick="history.back()">&#10005;</button></div>
<div style="padding:4px 4px 20px"><div style="font-size:28px;font-weight:800;letter-spacing:-.5px">Game Tool</div><div style="font-size:14px;color:#888;margin-top:4px;font-family:monospace" id="gt-ip">192.168.1.100</div></div>
<div class="card">
<div class="tit"><span>Installed Games</span><button class="btn-outline" onclick="scanGames()">SCAN</button></div>
<div class="list" id="game-list">
<div class="empty">Press SCAN to search for games on USB and internal storage</div>
</div>
</div>
</div>
<script>
let ps5ip='192.168.1.100';
function getApiBase(){return 'http://'+ps5ip+':9040';}
function init(){
  try{ if(Android&&Android.getIp) ps5ip=Android.getIp(); }catch(e){}
  document.getElementById('gt-ip').textContent=ps5ip;
}
function scanGames(){
  const list=document.getElementById('game-list');
  list.innerHTML='<div class="empty">Scanning...</div>';
  fetch(getApiBase()+'/api/games')
    .then(r=>r.json()).then(data=>{
      const games=data.games||[];
      if(!games.length){list.innerHTML='<div class="empty">No games found</div>';return;}
      list.innerHTML='';
      games.forEach(g=>{
        const div=document.createElement('div');
        div.className='game-item';
        div.innerHTML='<div class="game-icon">&#127918;</div><div class="game-info"><div class="game-name">'+escapeHtml(g.name)+'</div><div class="game-ver">'+(g.size?formatSize(g.size):'')+'</div></div>';
        list.appendChild(div);
      });
    }).catch(e=>list.innerHTML='<div class="empty">Error: '+e+'</div>');
}
function formatSize(b){if(b>1e9)return(b/1e9).toFixed(2)+' GB';if(b>1e6)return(b/1e6).toFixed(2)+' MB';if(b>1e3)return(b/1e3).toFixed(2)+' KB';return b+' B';}
function escapeHtml(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
init();
</script>
</body>
</html>
